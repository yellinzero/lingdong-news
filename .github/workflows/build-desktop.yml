name: Desktop checks and packages
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      docs_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    name: Version, logic and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.docs_only }}
        with:
          version: 10.5.0
      - uses: actions/setup-node@v7.1.0
        if: ${{ !inputs.docs_only }}
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-node@v7.1.0
        if: inputs.docs_only
        with:
          node-version: '24'
      - run: node scripts/version.mjs check
      - run: node scripts/check-docs.mjs
      - run: node --test scripts/ci-changes.test.mjs
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.docs_only }}
      - run: pnpm test:release
        if: ${{ !inputs.docs_only }}
      - run: pnpm test
        if: ${{ !inputs.docs_only }}
      - run: pnpm build
        if: ${{ !inputs.docs_only }}
      - run: pnpm exec playwright install --with-deps webkit chromium
        if: ${{ !inputs.docs_only }}
      - run: pnpm test:ui --workers=1 --reporter=line,html
        if: ${{ !inputs.docs_only }}
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() && !inputs.docs_only }}
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  native:
    name: ${{ matrix.platform }} build
    runs-on: ${{ inputs.docs_only && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      # Keep the existing required check names while avoiding native runners and builds.
      - name: Documentation-only change
        if: inputs.docs_only
        run: echo "Documentation checked by the quality job; no desktop package is needed."
      - uses: actions/checkout@v7.0.1
        if: ${{ !inputs.docs_only }}
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.docs_only }}
        with:
          version: 10.5.0
      - uses: actions/setup-node@v7.1.0
        if: ${{ !inputs.docs_only }}
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.docs_only }}
        with:
          targets: ${{ matrix.rust-targets }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ !inputs.docs_only }}
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - if: ${{ !inputs.docs_only && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.docs_only }}
      - run: pnpm version:check
        if: ${{ !inputs.docs_only }}
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
        if: ${{ !inputs.docs_only }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        if: ${{ !inputs.docs_only }}
      - name: Build platform package
        if: ${{ !inputs.docs_only }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Collect named release installers
        if: inputs.release
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/release.mjs collect "src-tauri/target/$TARGET/release/bundle" artifacts "$PLATFORM"
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.release
        with:
          name: installers-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
